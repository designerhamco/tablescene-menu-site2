<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아티메뉴 이메일 인증</title>
  </head>
  <body style="margin:0;background:#f4f4f5;color:#18181b;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;background:#f4f4f5;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border-collapse:collapse;background:#ffffff;border:1px solid #e4e4e7;border-radius:20px;">
            <tr>
              <td style="padding:36px 36px 32px;">
                <p style="margin:0 0 32px;font-size:20px;font-weight:700;letter-spacing:-0.02em;">ArtiMenu</p>
                <h1 style="margin:0;font-size:28px;line-height:1.35;font-weight:700;letter-spacing:-0.035em;">이메일 인증을 완료해 주세요</h1>
                <p style="margin:16px 0 0;font-size:15px;line-height:1.75;color:#52525b;">아티메뉴 가입을 마치려면 아래 버튼을 눌러 이메일 주소를 인증해 주세요.</p>
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px 0 0;border-collapse:collapse;">
                  <tr>
                    <td style="border-radius:12px;background:#18181b;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 24px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">이메일 인증하기</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:32px 0 0;font-size:13px;line-height:1.7;color:#71717a;">본인이 가입을 요청하지 않았다면 이 메일을 무시해 주세요.</p>
                <p style="margin:20px 0 8px;font-size:12px;line-height:1.6;color:#a1a1aa;">버튼이 작동하지 않으면 아래 주소를 브라우저에 붙여 넣어 주세요.</p>
                <p style="margin:0;word-break:break-all;font-size:12px;line-height:1.6;color:#71717a;">
                  <a href="{{ .ConfirmationURL }}" style="color:#52525b;text-decoration:underline;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#a1a1aa;">아티메뉴 · 디앤디커머스</p>
        </td>
      </tr>
    </table>
  </body>
</html>
